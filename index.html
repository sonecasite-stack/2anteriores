<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Money English Chatbot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#0f172a;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
}

.chat-container{
width:100%;
max-width:700px;
height:95vh;
background:#fff;
border-radius:20px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.header{
background:#1e293b;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.subtitle{
font-size:13px;
opacity:.8;
margin-top:4px;
}

.chat-box{
flex:1;
padding:15px;
overflow-y:auto;
background:#f4f7fb;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.message{
max-width:85%;
padding:12px 14px;
border-radius:18px;
line-height:1.5;
word-wrap:break-word;
position:relative;
}

.user{
align-self:flex-end;
background:#2563eb;
color:white;
border-bottom-right-radius:5px;
}

.bot{
align-self:flex-start;
background:white;
border:1px solid #e5e7eb;
border-bottom-left-radius:5px;
}

.audio-btn{
margin-top:8px;
border:none;
background:#e2e8f0;
padding:5px 9px;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.input-area{
padding:12px;
background:white;
display:flex;
gap:10px;
border-top:1px solid #ddd;
}

#userInput{
flex:1;
padding:14px;
border-radius:14px;
border:1px solid #cbd5e1;
font-size:16px;
outline:none;
}

button{
border:none;
cursor:pointer;
touch-action:manipulation;
}

.send-btn{
background:#16a34a;
color:white;
padding:14px 18px;
font-size:17px;
border-radius:12px;
}

.mic-btn{
width:55px;
height:55px;
border-radius:50%;
background:#dc2626;
color:white;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
}

.recording{
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{
transform:scale(1);
box-shadow:0 0 0 0 rgba(220,38,38,.7);
}
70%{
transform:scale(1.05);
box-shadow:0 0 0 15px rgba(220,38,38,0);
}
100%{
transform:scale(1);
}
}

.typing{
font-style:italic;
color:#666;
}

@media(max-width:600px){
.chat-container{
height:100vh;
border-radius:0;
}
}
</style>
</head>
<body>

<div class="chat-container">

<div class="header">
💰 Money English Chatbot
<div class="subtitle">
Practice English about money, banking, investing and finance
</div>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
<button id="micBtn" class="mic-btn">🎤</button>

<input
id="userInput"
placeholder="Ask something about money..."
autocomplete="off"
/>

<button id="sendBtn" class="send-btn">
Send
</button>
</div>

</div>

<script>

const API_KEY = "AQ.Ab8RN6LQepxCfOXbBjlMcbTsTf1Bz-cqWo-601bsWGawkYPQyQ";

const chatBox = document.getElementById("chatBox");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");

let lastBotMessage = "";

function scrollBottom(){
chatBox.scrollTop = chatBox.scrollHeight;
}

function addMessage(text,type,isBot=false){

const div = document.createElement("div");
div.className = `message ${type}`;

if(isBot){

div.innerHTML = `
<div>${text}</div>
<button class="audio-btn">🔊 Repeat</button>
`;

const btn = div.querySelector(".audio-btn");
btn.addEventListener("click",()=>{
speak(text);
});

}else{

div.textContent = text;

}

chatBox.appendChild(div);

scrollBottom();
}

function speak(text){

speechSynthesis.cancel();

const utter = new SpeechSynthesisUtterance(text);

utter.lang = "en-US";
utter.rate = 0.95;
utter.pitch = 1;

speechSynthesis.speak(utter);

}

function addTyping(){

const div = document.createElement("div");

div.id = "typing";

div.className = "message bot typing";

div.textContent = "Typing...";

chatBox.appendChild(div);

scrollBottom();

}

function removeTyping(){

const t = document.getElementById("typing");

if(t) t.remove();

}

async function sendMessage(){

const text = input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value = "";

addTyping();

try{

const prompt = `
You are an English teacher chatbot.

Topic: MONEY.

Rules:
- Always answer in English.
- Keep answers short.
- Correct grammar mistakes politely.
- Encourage the learner to continue.
- Focus on money, saving, investing, banking, salaries, business, personal finance and spending.
- Ask one follow-up question.
- Maximum 120 words.
- Friendly conversational style.
User: ${text}
`;

const response = await fetch(
`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:prompt
}
]
}
]
})
}
);

const data = await response.json();

removeTyping();

const botText =
data.candidates?.[0]?.content?.parts?.[0]?.text ||
"Sorry, I couldn't answer.";

lastBotMessage = botText;

addMessage(botText,"bot",true);

speak(botText);

}
catch(error){

removeTyping();

addMessage(
"Connection error. Please try again.",
"bot",
true
);

console.error(error);

}

}

sendBtn.addEventListener("click",sendMessage);

input.addEventListener("keydown",(e)=>{
if(e.key==="Enter"){
sendMessage();
}
});

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(SpeechRecognition){

const recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;
recognition.interimResults = false;

micBtn.addEventListener("click",()=>{

recognition.start();

});

recognition.onstart = ()=>{

micBtn.classList.add("recording");
micBtn.textContent = "⏹";

};

recognition.onend = ()=>{

micBtn.classList.remove("recording");
micBtn.textContent = "🎤";

};

recognition.onresult = (event)=>{

const transcript =
event.results[0][0].transcript;

input.value = transcript;

sendMessage();

};

recognition.onerror = (err)=>{
console.log(err);
};

}else{

micBtn.disabled = true;
micBtn.title =
"Speech Recognition not supported";
}

window.onload = ()=>{

const welcome = `
Hello! I'm your Money English Coach.

We will practice English about money, saving, banking, investing and personal finance.

What do you usually spend most of your money on?
`;

addMessage(welcome,"bot",true);

speak(welcome);

};

</script>

</body>
</html>
